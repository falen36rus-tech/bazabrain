name: Выпустить обновление

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py test kb
        env:
          DJANGO_DEBUG: '1'
      # A non-fast-forward push fails instead of overwriting an existing release.
      - name: Пометить проверенную версию для сервера
        run: git push origin HEAD:refs/heads/production
